name: Merge Jild 24 tashreeh v4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge chunks
        run: python3 merge_jild24_v4.py
      - name: Verify merged file
        run: |
          python3 - <<'EOF'
          import json, re
          import merge_jild24_v4 as m
          d = json.load(open('jild-24.json', encoding='utf-8'))
          items = d['masail']
          pages = set()
          for it in items:
              pages.update(it['pages'])
          print('items:', len(items))
          print('unique pages:', len(pages), 'min:', min(pages), 'max:', max(pages))
          print('ids unique:', len(set(it['id'] for it in items)) == len(items))
          print('empty jawab:', sum(1 for it in items if not it.get('tashreeh_jawab')))
          print('volume_ids:', sorted(set(it.get('volume_id') for it in items)))
          print('first id:', items[0]['id'])
          print('last id:', items[-1]['id'])
          exceptions = sorted(it['id'] for it in items if it.get('start_page') != min(it['pages']))
          print('start_page exceptions:', exceptions)
          raw = open('jild-24.json', encoding='utf-8').read()
          SAFHA = "\u0635\u0641\u062d\u06c1"
          LENT = "\u3010" + SAFHA
          print('lenticular markers remaining:', raw.count(LENT))
          print('short markers remaining:', len(re.findall(r"\[\u0635 \d+\]", raw)))
          print('[safha N] markers total:', len(re.findall(r"\[" + SAFHA + r" \d+\]", raw)))
          # Independent re-check of the exact v3 identity (lists embedded in merge script).
          ids = [it['id'] for it in items]
          assert ids == list(m.V3_IDS), 'ID sequence != v3'
          for it in items:
              assert it['pages'] == m.V3_PAGES[it['id']], f"{it['id']}: pages != v3"
          assert len(items) == 207
          assert len(pages) == 640
          assert min(pages) == 6 and max(pages) == 720
          assert len(set(it['id'] for it in items)) == len(items)
          assert set(it['id'] for it in items if not it.get('tashreeh_jawab')) == {'jild24-masala-64'}
          assert sorted(set(it.get('volume_id') for it in items)) == [39]
          assert exceptions == []
          assert items[0]['id'] == 'jild24-pesh-lafz'
          assert items[-1]['id'] == 'jild24-masala-284'
          assert LENT not in raw
          assert not re.search(r"\[\u0635 \d+\]", raw)
          print('VERIFICATION PASSED')
          EOF
      - name: Create release with merged file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la jild-24.json
          gh release create v1.0 jild-24.json --title "Jild 24 tashreeh v4 - merged" --notes "Merged easy-Urdu tashreeh v4 for Fatawa Razviya Jild 24: 207 items, 640 pages (volume_id 39). Generated by merge_jild24_v4.py from the 17 leaf chunk files in order 01, 02, 03, 04, 05, 06, 07, 08, 09, 10, 11a, 11b, 12, 13, 14, 15, 16 (3 simple joins: masala-18 (sawal concat), masala-166, masala-250 (72 pages); masala-84 joined from head + risala-139 tail (69 pages); stable sort by start_page); item order reproduces the v3 merged file exactly (first jild24-pesh-lafz, last jild24-masala-284). All 17 chunks carry start_page == min(pages) (0 derived). No renames at merge — the tail id is absorbed by its cross-id join. Exactly one empty jawab: jild24-masala-64 [196], empty in the v3 source itself (allow-listed). No page markers present in the chunks." || gh release upload v1.0 jild-24.json --clobber
